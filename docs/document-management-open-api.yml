openapi: 3.0.1
info:
  title: Management Service API
  description: All Management Service functionalities
  version: v0.0.1
servers:
  - url: /
    description: Default Server URL
tags:
  - name: Document Management
    description: Endpoints for document management.
paths:
  /documents:
    post:
      summary: Upload a PDF document
      description: >
        Upload a PDF document along with metadata including user, document name, and tags.
        The file is streamed directly to MinIO and metadata is stored in PostgreSQL.
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF file to upload.
                user:
                  type: string
                  description: The user associated with the document.
                documentName:
                  type: string
                  description: The name of the document.
                tags:
                  type: array
                  items:
                    type: string
                  description: List of tags.
              required:
                - file
                - user
                - documentName
      responses:
        '200':
          description: Document uploaded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Upload successful
        '400':
          description: Bad request – invalid file type or missing parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    example: INVALID_FILE_TYPE
                  message:
                    type: string
                    example: Only PDF files are allowed.
        '413':
          description: File size exceeds allowed limit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    example: FILE_TOO_LARGE
                  message:
                    type: string
                    example: File size exceeds the allowed limit.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    example: INTERNAL_ERROR
                  message:
                    type: string
                    example: An unexpected error occurred.